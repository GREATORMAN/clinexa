services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clinexa
      POSTGRES_USER: clinexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinexa"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://clinexa:${POSTGRES_PASSWORD}@db:5432/clinexa
      SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      STORAGE_PATH: /app/storage
    ports: ["8000:8080"]
    volumes: ["private_files:/app/storage"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgres_data:
  private_files:
