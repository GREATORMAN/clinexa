name: "Clinexa Enterprise CI/CD Deployment & Live E2E Testing"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      custom_base_url:
        description: "Custom Live Base URL override (Must not be localhost)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  DEFAULT_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
  PYTHON_VERSION: "3.11"
  FLUTTER_VERSION: "3.24.3"

jobs:
  # =========================================================================
  # BUILD, STATIC ANALYSIS, & DEPLOYMENT TO GITHUB PAGES
  # =========================================================================
  build-and-deploy:
    name: "Build & Deploy to Live GitHub Pages"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Stage 1: Repository Checkout
      - name: "Stage 1: Repository Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stage 2: Dependency Installation (Flutter & Node)
      - name: "Stage 2: Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: "Stage 2b: Install Flutter Dependencies"
        working-directory: ./Clinexa_Functional_v2/frontend
        run: |
          echo "Installing Flutter packages..."
          flutter pub get

      # Stage 3: Build Application
      - name: "Stage 3: Build Application (Flutter Web)"
        working-directory: ./Clinexa_Functional_v2/frontend
        run: |
          echo "Compiling Flutter Web application with base-href..."
          REPO_NAME="${{ github.event.repository.name }}"
          flutter build web --release --base-href "/$REPO_NAME/"

      # Stage 4: Static Analysis
      - name: "Stage 4: Static Analysis"
        working-directory: ./Clinexa_Functional_v2/frontend
        run: |
          echo "Running Flutter Analyze static code checks..."
          flutter analyze --no-fatal-infos || true

      # Stage 5: Deploy to GitHub Pages
      - name: "Stage 5a: Configure GitHub Pages"
        uses: actions/configure-pages@v5

      - name: "Stage 5b: Upload Pages Artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Clinexa_Functional_v2/frontend/build/web

      - name: "Stage 5c: Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4

  # =========================================================================
  # LIVE E2E SELENIUM AUTOMATION TESTING
  # =========================================================================
  live-e2e-testing:
    name: "Execute Live Selenium E2E Tests"
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      # Stage 1: Checkout Automation Codebase
      - name: "Checkout Codebase"
        uses: actions/checkout@v4

      # Stage 2: Setup Python & Chrome WebDriver
      - name: "Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "Setup Google Chrome & Drivers"
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: "stable"

      - name: "Install Automation Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager openpyxl pytest

      # Determine target BASE_URL
      - name: "Resolve Live Base URL"
        id: resolve_url
        run: |
          if [ -n "${{ github.event.inputs.custom_base_url }}" ]; then
            TARGET_URL="${{ github.event.inputs.custom_base_url }}"
          else
            TARGET_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          echo "TARGET_BASE_URL=$TARGET_URL" >> $GITHUB_ENV
          echo "Resolved live target URL: $TARGET_URL"

      # Stage 6: Wait for Deployment
      - name: "Stage 6: Wait for Deployment Propagation"
        run: |
          echo "Awaiting DNS propagation and CDN cache stabilization for $TARGET_BASE_URL..."
          sleep 15

      # Stage 7: Deployment Verification
      - name: "Stage 7: Deployment Verification"
        run: |
          echo "Executing HTTP 200 and static asset pre-flight verification on $TARGET_BASE_URL..."
          python -c "
          import urllib.request, sys
          url = '$TARGET_BASE_URL'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'CI-Deployment-Verifier'})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  code = resp.getcode()
                  print(f'Verification success: HTTP {code}')
                  if code != 200 and code not in (301, 302):
                      sys.exit(1)
          except Exception as e:
              print(f'Warning during pre-flight verify: {e}')
          "

      # Stage 8: Run Selenium E2E Tests (400+ cases against LIVE Pages)
      # Stage 9: Generate Reports
      # Stage 10: Generate Excel Reports
      - name: "Stages 8, 9, 10: Execute 400+ Selenium Tests & Generate Reports"
        env:
          BASE_URL: ${{ env.TARGET_BASE_URL }}
          HEADLESS: "true"
          WINDOW_WIDTH: "1920"
          WINDOW_HEIGHT: "1080"
        run: |
          echo "Executing Selenium test suite against LIVE environment: $BASE_URL"
          python automation/run_e2e_tests.py

      # Stage 11: Upload Artifacts (Retention: 30 Days)
      - name: "Stage 11: Upload All Reports & Evidence Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "clinexa-live-e2e-evidence-${{ github.run_number }}"
          path: |
            Test Results/Excel/
            Test Results/HTML/
            Test Results/Screenshots/
            Test Results/Logs/
            Test Results/JSON/
            Test Results/Summary/
          retention-days: 30

      # Stage 12: Publish Summary
      - name: "Stage 12: Publish GitHub Actions Execution Summary"
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi

      # Stage 13: Store Historical Results
      - name: "Stage 13: Store Historical Results"
        if: always()
        run: |
          mkdir -p .historical_evidence/${{ github.run_number }}
          cp -r "Test Results/"* .historical_evidence/${{ github.run_number }}/ || true
          echo "Historical test evidence indexed under run #${{ github.run_number }}"
