services:
  - type: web
    name: clinexa
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: Clinexa
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./clinexa_dev.db
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
